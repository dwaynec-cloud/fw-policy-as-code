---
# Atlanta datacenter rules - source of truth for fw-atl-dc01/dc02
# [a, b] = a list written on one line

rules:
  - name: payroll-web-to-api
    ticket: CHG0045120
    owner: payroll-app-team
    from_zone: web
    to_zone: app
    source: [10.10.5.0/24]
    destination: [10.20.8.15/32]
    service: [tcp-8443]
    action: allow
    log: true
    expires: "2027-10-27"

  - name: internal-to-dns
    ticket: CHG0041002
    owner: network-team
    from_zone: internal
    to_zone: infra
    source: [10.0.0.0/8]
    destination: [10.1.1.53/32, 10.1.1.54/32]
    service: [udp-53, tcp-53]
    action: allow
    log: true
    expires: "2027-06-30"


  - name: hr-web-to-api
    ticket: CHG0046001
    owner: hr-app-team
    from_zone: web
    to_zone: app
    source: [10.10.6.0/24]
    destination: [10.20.9.20/32]
    service: [tcp-8443]
    action: allow
    log: true
    expires: "2027-11-15"

  - name: backup-to-storage
    ticket: CHG0048001
    owner: infra-team
    from_zone: internal
    to_zone: storage
    source: [10.40.0.0/24]
    destination: [10.50.0.10/32]
    service: [tcp-445]
    action: allow
    log: true
    expires: "2027-09-30"
