---
name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt yamllint

      - name: Lint YAML
        run: yamllint rules/ playbooks/

      - name: Audit firewall rules
        run: python scripts/audit_rules.py
